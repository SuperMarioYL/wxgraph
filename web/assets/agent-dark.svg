<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="agent-dark-t agent-dark-d" data-palette="56bde6-6a81e7-acf6f0-0b4d974338e6">
<title id="agent-dark-t">wxgraph surfaces (dark)</title><desc id="agent-dark-d">One local graph serving the CLI, five MCP tools over stdio and the /wxgraph Skill.</desc>
<defs>
<linearGradient id="agent-dark-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="470"><stop stop-color="#56bde6"/><stop offset=".55" stop-color="#6a81e7"/><stop offset="1" stop-color="#acf6f0"/></linearGradient>
<radialGradient id="agent-dark-haze"><stop stop-color="#56bde6" stop-opacity=".16"/><stop offset="1" stop-color="#050a12" stop-opacity="0"/></radialGradient>
<marker id="agent-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6a81e7" stroke-width="1.5"/></marker>
</defs><style>
text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#eefdfc}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace}
.muted{fill:#95b1c4}
.title{font-weight:700;letter-spacing:-.4px}
.kicker{font-weight:700;letter-spacing:2px;fill:#95b1c4}
.panel{fill:#0c151f;stroke:#173141;stroke-width:1.2}
.key{fill:#0c151f;stroke:#56bde6;stroke-width:1.6}
.dashed{fill:#0c151f;stroke:#95b1c4;stroke-width:1.1;stroke-dasharray:6 5}
.chip{fill:#0a141d;stroke:#173141;stroke-width:1}
.wire{fill:none;stroke:#173141;stroke-width:1.5}
.flow{fill:none;stroke:#56bde6;stroke-width:1.8;stroke-dasharray:7 10;animation:dash 2.8s linear infinite}
.primary{fill:#56bde6}
.secondary{fill:#6a81e7}
.highlight{fill:#acf6f0}
.pulse{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}.flow{stroke-dasharray:none}}</style>
<rect width="1000" height="470" fill="#050a12"/>

<line x1="40" y1="0" x2="40" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="80" y1="0" x2="80" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="120" y1="0" x2="120" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="160" y1="0" x2="160" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="200" y1="0" x2="200" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="240" y1="0" x2="240" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="280" y1="0" x2="280" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="320" y1="0" x2="320" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="360" y1="0" x2="360" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="400" y1="0" x2="400" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="440" y1="0" x2="440" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="480" y1="0" x2="480" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="520" y1="0" x2="520" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="560" y1="0" x2="560" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="600" y1="0" x2="600" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="640" y1="0" x2="640" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="680" y1="0" x2="680" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="720" y1="0" x2="720" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="760" y1="0" x2="760" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="800" y1="0" x2="800" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="840" y1="0" x2="840" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="880" y1="0" x2="880" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="920" y1="0" x2="920" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="960" y1="0" x2="960" y2="470" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="40" x2="1000" y2="40" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="80" x2="1000" y2="80" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="120" x2="1000" y2="120" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="160" x2="1000" y2="160" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="200" x2="1000" y2="200" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="240" x2="1000" y2="240" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="280" x2="1000" y2="280" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="320" x2="1000" y2="320" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="360" x2="1000" y2="360" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="400" x2="1000" y2="400" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="440" x2="1000" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/>
<text x="30" y="38" font-size="11" class="kicker">INTEGRATION</text>
<text x="30" y="72" font-size="24" class="title">Three surfaces, one local graph</text>
<text x="30" y="96" font-size="12" class="muted">No daemon, no network call, no database — the graph is a JSON file on disk.</text>

<rect class="panel" x="40" y="126" width="270" height="132" rx="12"/>
<text x="58" y="154" font-size="11" class="kicker">CLI</text>
<text x="58" y="182" font-size="14" class="mono">6 commands</text>
<text x="58" y="206" font-size="11" class="mono">build · impact · explain</text>
<text x="58" y="226" font-size="11" class="mono">search · stats · init</text>
<text x="58" y="246" font-size="10.5" class="muted">--json for machines · -C for another project</text>

<rect class="panel" x="40" y="292" width="270" height="132" rx="12"/>
<text x="58" y="320" font-size="11" class="kicker">MCP OVER STDIO</text>
<text x="58" y="348" font-size="14" class="mono">5 tools</text>
<text x="58" y="372" font-size="11" class="mono">wxgraph_impact · explain</text>
<text x="58" y="392" font-size="11" class="mono">search · stats · build</text>
<text x="58" y="412" font-size="10.5" class="muted">stale graph → run wxgraph build</text>

<rect class="key" x="365" y="126" width="270" height="224" rx="12"/>
<text x="385" y="158" font-size="11" class="kicker">THE GRAPH</text>
<text x="385" y="190" font-size="16" class="mono">graph.json</text>
<text x="385" y="216" font-size="11.5" class="muted">6 node kinds</text>
<text x="385" y="238" font-size="11.5" class="muted">8 edge kinds</text>
<text x="385" y="260" font-size="11.5" class="mono primary">rerenders with file:line</text>
<text x="385" y="282" font-size="11.5" class="muted">source stamp</text>
<text x="385" y="304" font-size="11.5" class="mono muted">.wxgraph/graph.json</text>
<text x="385" y="332" font-size="10.5" class="muted">one JSON file, no database</text>

<rect class="panel" x="690" y="170" width="270" height="160" rx="12"/>
<text x="708" y="198" font-size="11" class="kicker">SKILL</text>
<text x="708" y="226" font-size="14" class="mono">/wxgraph</text>
<text x="708" y="250" font-size="11" class="muted">query the graph for render</text>
<text x="708" y="268" font-size="11" class="muted">impact across files; read a</text>
<text x="708" y="286" font-size="11" class="muted">file for local questions</text>
<text x="708" y="310" font-size="10.5" class="muted">copied into the agent's skills dir</text>

<path class="wire" d="M310 192 H365"/><path class="flow" d="M312 192 H361" marker-end="url(#agent-dark-arrow)"/>
<path class="wire" d="M310 358 H365"/><path class="flow" d="M312 358 H361" marker-end="url(#agent-dark-arrow)"/>
<path class="wire" d="M635 238 H690"/><path class="flow" d="M637 238 H686" marker-end="url(#agent-dark-arrow)"/>

<text x="30" y="444" font-size="11.5" class="muted">Local only: no hosted service · no network call · no account · no telemetry. Queries refuse a stale source stamp.</text>
</svg>