".6"/><line x1="0" y1="96" x2="640" y2="96" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="128" x2="640" y2="128" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="160" x2="640" y2="160" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="192" x2="640" y2="192" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="224" x2="640" y2="224" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="256" x2="640" y2="256" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="288" x2="640" y2="288" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="320" x2="640" y2="320" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="352" x2="640" y2="352" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="384" x2="640" y2="384" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="416" x2="640" y2="416" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="448" x2="640" y2="448" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="480" x2="640" y2="480" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="512" x2="640" y2="512" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="544" x2="640" y2="544" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="576" x2="640" y2="576" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="608" x2="640" y2="608" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="640" x2="640" y2="640" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="672" x2="640" y2="672" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="704" x2="640" y2="704" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="736" x2="640" y2="736" stroke="#cbebf7" stroke-opacity=".2" stroke-width=".6"/>
<text x="36" y="42" font-size="11" class="kicker">WORKFLOW</text>
<text x="36" y="78" font-size="23" class="title">From four file kinds</text>
<text x="36" y="106" font-size="23" class="title">to one graph</text>
<text x="36" y="132" font-size="12" class="muted">Parsing is per file; resolution joins the hops.</text>

<text x="36" y="166" font-size="11" class="kicker">01 / INPUTS</text>
<rect class="panel" x="36" y="178" width="270" height="72" rx="12"/><text x="52" y="206" font-size="13" class="mono">app.json + *.json</text><text x="52" y="228" font-size="10.5" class="muted">pages · subpackages · registry</text>
<rect class="panel" x="334" y="178" width="270" height="72" rx="12"/><text x="350" y="206" font-size="13" class="mono">*.wxml + *.js</text><text x="350" y="228" font-size="10.5" class="muted">bindings · handlers · setData</text>

<path class="wire" d="M320 280 V306"/><path class="flow" d="M320 282 V302" marker-end="url(#path-mobile-light-arrow)"/>

<text x="36" y="300" font-size="11" class="kicker">02 / PARSE</text>
<rect class="panel" x="36" y="312" width="568" height="66" rx="12"/><text x="52" y="338" font-size="13" class="mono">manifest</text><text x="190" y="338" font-size="11.5" class="muted">pages · roots · independent</text><text x="52" y="360" font-size="11" class="muted">both subpackages and subPackages spellings</text>
<rect class="panel" x="36" y="386" width="568" height="66" rx="12"/><text x="52" y="412" font-size="13" class="mono">WXML</text><text x="190" y="412" font-size="11.5" class="muted">elements · bindings · wx:for scope</text><text x="52" y="434" font-size="11" class="muted">bindtap and bind:tap normalise to one handles edge</text>
<rect class="panel" x="36" y="460" width="568" height="66" rx="12"/><text x="52" y="486" font-size="13" class="mono">acorn</text><text x="190" y="486" font-size="11.5" class="muted">ES module first, classic-script retry</text><text x="52" y="508" font-size="11" class="muted">unparseable file → unresolved_file warning</text>

<path class="wire" d="M320 544 V570"/><path class="flow" d="M320 546 V566" marker-end="url(#path-mobile-light-arrow)"/>

<text x="36" y="564" font-size="11" class="kicker">03 / RESOLVE</text>
<rect class="key" x="36" y="576" width="568" height="86" rx="12"/><text x="52" y="602" font-size="14" class="mono">graph.json</text><text x="150" y="602" font-size="11.5" class="muted">6 node kinds · 8 edge kinds · file:line</text><text x="52" y="626" font-size="11.5" class="mono primary">rerenders: setData key → data path → property → element</text><text x="52" y="648" font-size="11" class="muted">one JSON file plus a source stamp</text>

<path class="wire" d="M320 670 V690"/><path class="flow" d="M320 672 V686" marker-end="url(#path-mobile-light-arrow)"/>

<text x="36" y="688" font-size="11" class="kicker">04 / QUERY</text>
<rect class="panel" x="36" y="700" width="270" height="44" rx="12"/><text x="52" y="727" font-size="12.5" class="mono">CLI · 6 commands</text>
<rect class="panel" x="334" y="700" width="270" height="44" rx="12"/><text x="350" y="727" font-size="12.5" class="mono">MCP · 5 tools</text>
