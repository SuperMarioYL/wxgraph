<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img" aria-labelledby="path-mobile-light-t path-mobile-light-d" data-palette="56bde6-6a81e7-acf6f0-0b4d974338e6">
<title id="path-mobile-light-t">wxgraph pipeline, narrow (light)</title><desc id="path-mobile-light-d">The same parse, resolve and query pipeline stacked for a phone-width viewport.</desc>
<defs>
<linearGradient id="path-mobile-light-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="760"><stop stop-color="#387a95"/><stop offset=".55" stop-color="#5a6dc4"/><stop offset="1" stop-color="#557977"/></linearGradient>
<radialGradient id="path-mobile-light-haze"><stop stop-color="#387a95" stop-opacity=".16"/><stop offset="1" stop-color="#f9fdfe" stop-opacity="0"/></radialGradient>
<marker id="path-mobile-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#5a6dc4" stroke-width="1.5"/></marker>
</defs><style>
text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#132430}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace}
.muted{fill:#557388}
.title{font-weight:700;letter-spacing:-.4px}
.kicker{font-weight:700;letter-spacing:2px;fill:#557388}
.panel{fill:#f7fcfe;stroke:#cbebf7;stroke-width:1.2}
.key{fill:#f7fcfe;stroke:#387a95;stroke-width:1.6}
.dashed{fill:#f7fcfe;stroke:#557388;stroke-width:1.1;stroke-dasharray:6 5}
.chip{fill:#f3fafd;stroke:#cbebf7;stroke-width:1}
.wire{fill:none;stroke:#cbebf7;stroke-width:1.5}
.flow{fill:none;stroke:#387a95;stroke-width:1.8;stroke-dasharray:7 10;animation:dash 2.8s linear infinite}
.primary{fill:#387a95}
.secondary{fill:#5a6dc4}
.highlight{fill:#557977}
.pulse{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}.flow{stroke-dasharray:none}}</style>
