<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="model-light-t model-light-d" data-palette="56bde6-6a81e7-acf6f0-0b4d974338e6">
<title id="model-light-t">wxgraph graph model (light)</title><desc id="model-light-d">The rerenders chain from a setData key through data path, host attribute, declared property and child binding to a WXML element, with failed hops and non-literal setData kept visible.</desc>
<defs>
<linearGradient id="model-light-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="540"><stop stop-color="#387a95"/><stop offset=".55" stop-color="#5a6dc4"/><stop offset="1" stop-color="#557977"/></linearGradient>
<radialGradient id="model-light-haze"><stop stop-color="#387a95" stop-opacity=".16"/><stop offset="1" stop-color="#f9fdfe" stop-opacity="0"/></radialGradient>
<marker id="model-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#5a6dc4" stroke-width="1.5"/></marker>
</defs><style>
text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#132430}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace}
.muted{fill:#557388}
.title{font-weight:700;letter-spacing:-.4px}
.kicker{font-weight:700;letter-spacing:2px;fill:#557388}
.panel{fill:#f7fcfe;stroke:#cbebf7;stroke-width:1.2}
.key{fill:#f7fcfe;stroke:#387a95;stroke-width:1.6}
.dashed{fill:#f7fcfe;stroke:#557388;stroke-width:1.1;stroke-dasharray:6 5}
.chip{fill:#f3fafd;stroke:#cbebf7;stroke-width:1}
.wire{fill:none;stroke:#cbebf7;stroke-width:1.5}
.flow{fill:none;stroke:#387a95;stroke-width:1.8;stroke-dasharray:7 10;animation:dash 2.8s linear infinite}
.primary{fill:#387a95}
.secondary{fill:#5a6dc4}
.highlight{fill:#557977}
.pulse{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}.flow{stroke-dasharray:none}}</style>
<rect width="1000" height="540" fill="#f9fdfe"/>

<line x1="40" y1="0" x2="40" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="80" y1="0" x2="80" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="120" y1="0" x2="120" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="160" y1="0" x2="160" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="200" y1="0" x2="200" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="240" y1="0" x2="240" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="280" y1="0" x2="280" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="320" y1="0" x2="320" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="360" y1="0" x2="360" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="400" y1="0" x2="400" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="440" y1="0" x2="440" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="480" y1="0" x2="480" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="520" y1="0" x2="520" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="560" y1="0" x2="560" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="600" y1="0" x2="600" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="640" y1="0" x2="640" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="680" y1="0" x2="680" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="720" y1="0" x2="720" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="760" y1="0" x2="760" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="800" y1="0" x2="800" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="840" y1="0" x2="840" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="880" y1="0" x2="880" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="920" y1="0" x2="920" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="960" y1="0" x2="960" y2="540" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="40" x2="1000" y2="40" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="80" x2="1000" y2="80" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="120" x2="1000" y2="120" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="160" x2="1000" y2="160" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="200" x2="1000" y2="200" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="240" x2="1000" y2="240" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="280" x2="1000" y2="280" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="320" x2="1000" y2="320" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="360" x2="1000" y2="360" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="400" x2="1000" y2="400" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="440" x2="1000" y2="440" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="480" x2="1000" y2="480" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="520" x2="1000" y2="520" stroke="#cbebf7" stroke-opacity=".26" stroke-width=".6"/>
<text x="25" y="38" font-size="11" class="kicker">ARCHITECTURE</text>
<text x="25" y="72" font-size="24" class="title">Six nodes, eight edges, one owned edge</text>
<text x="25" y="96" font-size="12" class="muted">rerenders is emitted only when every hop resolves; a miss is reported, never guessed.</text>
<rect class="panel" x="25" y="150" width="145" height="112" rx="12"/><path class="wire" d="M172 206 H185"/><path class="flow" d="M172 206 H182" marker-end="url(#model-light-arrow)"/><rect class="panel" x="187" y="150" width="145" height="112" rx="12"/><path class="wire" d="M334 206 H347"/><path class="flow" d="M334 206 H344" marker-end="url(#model-light-arrow)"/><rect class="panel" x="349" y="150" width="145" height="112" rx="12"/><path class="wire" d="M496 206 H509"/><path class="flow" d="M496 206 H506" marker-end="url(#model-light-arrow)"/><rect class="panel" x="511" y="150" width="145" height="112" rx="12"/><path class="wire" d="M658 206 H671"/><path class="flow" d="M658 206 H668" marker-end="url(#model-light-arrow)"/><rect class="panel" x="673" y="150" width="145" height="112" rx="12"/><path class="wire" d="M820 206 H833"/><path class="flow" d="M820 206 H830" marker-end="url(#model-light-arrow)"/><rect class="key" x="835" y="150" width="145" height="112" rx="12"/><text x="39" y="174" font-size="10" class="kicker">01</text><text x="39" y="200" font-size="12.5">setData key</text><text x="39" y="226" font-size="11" class="mono primary">items</text><text x="39" y="248" font-size="8.5" class="mono muted">pages/cart/index.js:20</text><text x="201" y="174" font-size="10" class="kicker">02</text><text x="201" y="200" font-size="12.5">data path</text><text x="201" y="226" font-size="11" class="mono primary">items[].unitPrice</text><text x="201" y="248" font-size="8.5" class="mono muted">pages/cart/index.js</text><text x="363" y="174" font-size="10" class="kicker">03</text><text x="363" y="200" font-size="12.5">host attribute</text><text x="363" y="226" font-size="11" class="mono primary">price=&quot;{{...}}&quot;</text><text x="363" y="248" font-size="8.5" class="mono muted">pages/cart/index.wxml:5</text><text x="525" y="174" font-size="10" class="kicker">04</text><text x="525" y="200" font-size="12.5">declared property</text><text x="525" y="226" font-size="11" class="mono primary">price</text><text x="525" y="248" font-size="8.5" class="mono muted">price-card · component</text><text x="687" y="174" font-size="10" class="kicker">05</text><text x="687" y="200" font-size="12.5">child binding</text><text x="687" y="226" font-size="11" class="mono primary">{{price}}</text><text x="687" y="248" font-size="8.5" class="mono muted">price-card.wxml:2</text><text x="849" y="174" font-size="10" class="kicker">06</text><text x="849" y="200" font-size="12.5">WXML element</text><text x="849" y="226" font-size="11" class="mono primary">&lt;text&gt;</text><text x="849" y="248" font-size="8.5" class="mono muted">price-card.wxml:2</text>
<path class="wire" d="M25 282 H975" stroke-dasharray="3 6"/>
<text x="25" y="312" font-size="11.5" class="mono">via prop:&lt;name&gt; — the value crosses a declared component property</text>
<text x="25" y="332" font-size="11.5" class="mono muted">via direct — the element sits in the setData owner's own template</text>

<rect class="dashed" x="25" y="360" width="460" height="132" rx="12"/>
<text x="45" y="390" font-size="11" class="kicker">FAILED HOP — PRINTED, NOT GUESSED</text>
<text x="45" y="416" font-size="12" class="mono primary">no_binding</text><text x="140" y="416" font-size="11.5" class="muted">the property feeds no binding</text>
<text x="45" y="438" font-size="12" class="mono primary">unknown_property</text><text x="185" y="438" font-size="11.5" class="muted">the tag declares no such property</text>
<text x="45" y="460" font-size="12" class="mono primary">no_child_binding</text><text x="190" y="460" font-size="11.5" class="muted">the property reaches no child node</text>
<text x="45" y="482" font-size="11" class="muted">impact prints unresolved hop(s); explain prints every attempt.</text>

<rect class="panel" x="515" y="360" width="460" height="132" rx="12"/>
<text x="535" y="390" font-size="11" class="kicker">NON-LITERAL SETDATA</text>
<text x="535" y="418" font-size="12.5" class="mono">this.setData(patch)</text>
<text x="535" y="442" font-size="11.5" class="muted">The call site is recorded as unresolved_setdata;</text>
<text x="535" y="462" font-size="11.5" class="muted">the keys are unknown, so no edge is invented.</text>
<text x="535" y="482" font-size="11" class="muted">Read that handler by hand — the graph says so.</text>

<text x="25" y="522" font-size="11.5" class="muted">A resolved edge is structural: a wx:if guard can still keep the element out of the render.</text>
</svg>