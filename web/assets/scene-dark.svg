<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="scene-dark-t scene-dark-d" data-palette="56bde6-6a81e7-acf6f0-0b4d974338e6">
<title id="scene-dark-t">wxgraph scene (dark)</title><desc id="scene-dark-d">Illustrative still: a setData site reaches a data path, crosses a declared property and lands on a WXML element.</desc>
<defs>
<linearGradient id="scene-dark-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="600"><stop stop-color="#56bde6"/><stop offset=".55" stop-color="#6a81e7"/><stop offset="1" stop-color="#acf6f0"/></linearGradient>
<radialGradient id="scene-dark-haze"><stop stop-color="#56bde6" stop-opacity=".16"/><stop offset="1" stop-color="#050a12" stop-opacity="0"/></radialGradient>
<marker id="scene-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6a81e7" stroke-width="1.5"/></marker>
</defs><style>
text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#eefdfc}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace}
.muted{fill:#95b1c4}
.title{font-weight:700;letter-spacing:-.4px}
.kicker{font-weight:700;letter-spacing:2px;fill:#95b1c4}
.panel{fill:#0c151f;stroke:#173141;stroke-width:1.2}
.key{fill:#0c151f;stroke:#56bde6;stroke-width:1.6}
.dashed{fill:#0c151f;stroke:#95b1c4;stroke-width:1.1;stroke-dasharray:6 5}
.chip{fill:#0a141d;stroke:#173141;stroke-width:1}
.wire{fill:none;stroke:#173141;stroke-width:1.5}
.flow{fill:none;stroke:#56bde6;stroke-width:1.8;stroke-dasharray:7 10;animation:dash 2.8s linear infinite}
.primary{fill:#56bde6}
.secondary{fill:#6a81e7}
.highlight{fill:#acf6f0}
.pulse{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}.flow{stroke-dasharray:none}}</style>
<rect width="1200" height="600" fill="#050a12"/>

<line x1="40" y1="0" x2="40" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="80" y1="0" x2="80" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="120" y1="0" x2="120" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="160" y1="0" x2="160" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="200" y1="0" x2="200" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="240" y1="0" x2="240" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="280" y1="0" x2="280" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="320" y1="0" x2="320" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="360" y1="0" x2="360" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="400" y1="0" x2="400" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="440" y1="0" x2="440" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="480" y1="0" x2="480" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="520" y1="0" x2="520" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="560" y1="0" x2="560" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="600" y1="0" x2="600" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="640" y1="0" x2="640" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="680" y1="0" x2="680" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="720" y1="0" x2="720" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="760" y1="0" x2="760" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="800" y1="0" x2="800" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="840" y1="0" x2="840" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="880" y1="0" x2="880" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="920" y1="0" x2="920" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="960" y1="0" x2="960" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="1000" y1="0" x2="1000" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="1040" y1="0" x2="1040" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="1080" y1="0" x2="1080" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="1120" y1="0" x2="1120" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="1160" y1="0" x2="1160" y2="600" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="40" x2="1200" y2="40" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="80" x2="1200" y2="80" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="120" x2="1200" y2="120" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="160" x2="1200" y2="160" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="200" x2="1200" y2="200" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="240" x2="1200" y2="240" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="280" x2="1200" y2="280" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="320" x2="1200" y2="320" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="360" x2="1200" y2="360" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="400" x2="1200" y2="400" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="440" x2="1200" y2="440" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="480" x2="1200" y2="480" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="520" x2="1200" y2="520" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/><line x1="0" y1="560" x2="1200" y2="560" stroke="#173141" stroke-opacity=".2" stroke-width=".6"/>
<rect x="240" y="40" width="720" height="520" fill="url(#scene-dark-haze)"/>
<text x="36" y="44" font-size="12" class="kicker">ILLUSTRATIVE SCENE</text>
<text x="36" y="82" font-size="27" class="title">One resolved re-render path</text>
<text x="36" y="108" font-size="13" class="muted">setData key → data path → declared property → WXML element</text>

<rect class="key" x="50" y="240" width="270" height="140" rx="12"/>
<text x="70" y="272" font-size="11" class="kicker">SET_DATA SITE</text>
<text x="70" y="300" font-size="15" class="mono">setData({items, editing})</text>
<text x="70" y="326" font-size="12" class="mono muted">handler onEdit</text>
<text x="70" y="348" font-size="12" class="mono muted">pages/cart/index.js:20</text>
<text x="70" y="370" font-size="11" class="muted">keys: items · editing</text>

<rect class="panel" x="390" y="240" width="280" height="140" rx="12"/>
<text x="410" y="272" font-size="11" class="kicker">DATA PATH</text>
<text x="410" y="300" font-size="15" class="mono">items[].unitPrice</text>
<text x="410" y="326" font-size="12" class="mono muted">pages/cart/index.js</text>
<text x="410" y="348" font-size="12" class="mono muted">wx:for alias resolved</text>
<text x="410" y="370" font-size="11" class="muted">item.unitPrice → items[].unitPrice</text>

<path class="wire" d="M320 310 H390"/>

<rect class="dashed" x="760" y="120" width="400" height="420" rx="16"/>
<text x="782" y="148" font-size="11" class="kicker">COMPONENT BOUNDARY</text>
<text x="782" y="174" font-size="15" class="mono">components/price-card</text>

<path class="wire" d="M670 292 H720 V262 H782"/>
<path class="wire" d="M670 328 H720 V398 H782"/>
<path class="flow" d="M330 310 H384" marker-end="url(#scene-dark-arrow)"/>
<circle class="primary pulse" cx="355" cy="310" r="3.4"/>
<circle class="secondary pulse" cx="716" cy="276" r="3.2"/>
<circle class="highlight pulse" cx="716" cy="356" r="3.2"/>

<rect class="key" x="782" y="196" width="356" height="116" rx="12"/>
<text x="802" y="226" font-size="14" class="mono">&lt;text&gt;</text>
<text x="802" y="250" font-size="12" class="mono muted">components/price-card.wxml:2</text>
<text x="802" y="272" font-size="12" class="mono primary">[via prop:price]</text>
<text x="802" y="294" font-size="11" class="muted">value crosses the declared property</text>

<rect class="panel" x="782" y="340" width="356" height="116" rx="12"/>
<text x="802" y="370" font-size="14" class="mono">&lt;view&gt; class=&quot;edit-mask&quot;</text>
<text x="802" y="394" font-size="12" class="mono muted">components/price-card.wxml:4</text>
<text x="802" y="416" font-size="12" class="mono primary">[via prop:editing]</text>
<text x="802" y="438" font-size="11" class="muted">same setData call, second key</text>

<text x="36" y="566" font-size="12" class="muted">Exact counts and file:line values belong to the recorded demo below — this still is illustrative.</text>
</svg>