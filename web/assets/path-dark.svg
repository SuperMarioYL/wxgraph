<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="path-dark-t path-dark-d" data-palette="56bde6-6a81e7-acf6f0-0b4d974338e6">
<title id="path-dark-t">wxgraph pipeline (dark)</title><desc id="path-dark-d">app.json, component JSON, WXML and JS are parsed and resolved into graph.json with a source stamp, then queried by the CLI and the MCP server.</desc>
<defs>
<linearGradient id="path-dark-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="440"><stop stop-color="#56bde6"/><stop offset=".55" stop-color="#6a81e7"/><stop offset="1" stop-color="#acf6f0"/></linearGradient>
<radialGradient id="path-dark-haze"><stop stop-color="#56bde6" stop-opacity=".16"/><stop offset="1" stop-color="#050a12" stop-opacity="0"/></radialGradient>
<marker id="path-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6a81e7" stroke-width="1.5"/></marker>
</defs><style>
text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#eefdfc}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace}
.muted{fill:#95b1c4}
.title{font-weight:700;letter-spacing:-.4px}
.kicker{font-weight:700;letter-spacing:2px;fill:#95b1c4}
.panel{fill:#0c151f;stroke:#173141;stroke-width:1.2}
.key{fill:#0c151f;stroke:#56bde6;stroke-width:1.6}
.dashed{fill:#0c151f;stroke:#95b1c4;stroke-width:1.1;stroke-dasharray:6 5}
.chip{fill:#0a141d;stroke:#173141;stroke-width:1}
.wire{fill:none;stroke:#173141;stroke-width:1.5}
.flow{fill:none;stroke:#56bde6;stroke-width:1.8;stroke-dasharray:7 10;animation:dash 2.8s linear infinite}
.primary{fill:#56bde6}
.secondary{fill:#6a81e7}
.highlight{fill:#acf6f0}
.pulse{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}.flow{stroke-dasharray:none}}</style>
<rect width="1000" height="440" fill="#050a12"/>

<line x1="40" y1="0" x2="40" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="80" y1="0" x2="80" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="120" y1="0" x2="120" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="160" y1="0" x2="160" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="200" y1="0" x2="200" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="240" y1="0" x2="240" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="280" y1="0" x2="280" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="320" y1="0" x2="320" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="360" y1="0" x2="360" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="400" y1="0" x2="400" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="440" y1="0" x2="440" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="480" y1="0" x2="480" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="520" y1="0" x2="520" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="560" y1="0" x2="560" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="600" y1="0" x2="600" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="640" y1="0" x2="640" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="680" y1="0" x2="680" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="720" y1="0" x2="720" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="760" y1="0" x2="760" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="800" y1="0" x2="800" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="840" y1="0" x2="840" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="880" y1="0" x2="880" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="920" y1="0" x2="920" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="960" y1="0" x2="960" y2="440" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="40" x2="1000" y2="40" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="80" x2="1000" y2="80" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="120" x2="1000" y2="120" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="160" x2="1000" y2="160" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="200" x2="1000" y2="200" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="240" x2="1000" y2="240" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="280" x2="1000" y2="280" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="320" x2="1000" y2="320" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="360" x2="1000" y2="360" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/><line x1="0" y1="400" x2="1000" y2="400" stroke="#173141" stroke-opacity=".26" stroke-width=".6"/>
<text x="30" y="38" font-size="11" class="kicker">WORKFLOW</text>
<text x="30" y="72" font-size="24" class="title">From four file kinds to one graph</text>
<text x="30" y="96" font-size="12" class="muted">Parsing is per file; resolution is where partial answers become a graph.</text>

<text x="30" y="128" font-size="11" class="kicker">01 / INPUTS</text>
<rect class="panel" x="30" y="140" width="205" height="50" rx="12"/><text x="46" y="162" font-size="13" class="mono">app.json</text><text x="46" y="180" font-size="10.5" class="muted">pages · tabBar · subpackages</text>
<rect class="panel" x="30" y="198" width="205" height="50" rx="12"/><text x="46" y="220" font-size="13" class="mono">*.json</text><text x="46" y="238" font-size="10.5" class="muted">usingComponents registry</text>
<rect class="panel" x="30" y="256" width="205" height="50" rx="12"/><text x="46" y="278" font-size="13" class="mono">*.wxml</text><text x="46" y="296" font-size="10.5" class="muted">elements · bindings · wx:for</text>
<rect class="panel" x="30" y="314" width="205" height="50" rx="12"/><text x="46" y="336" font-size="13" class="mono">*.js</text><text x="46" y="354" font-size="10.5" class="muted">handlers · setData · cloud calls</text>

<path class="wire" d="M240 250 H270"/><path class="flow" d="M242 250 H266" marker-end="url(#path-dark-arrow)"/>

<text x="275" y="128" font-size="11" class="kicker">02 / PARSE</text>
<rect class="panel" x="275" y="140" width="205" height="64" rx="12"/><text x="291" y="166" font-size="13" class="mono">manifest</text><text x="291" y="186" font-size="10.5" class="muted">pages · roots · independent</text>
<rect class="panel" x="275" y="212" width="205" height="64" rx="12"/><text x="291" y="238" font-size="13" class="mono">WXML</text><text x="291" y="258" font-size="10.5" class="muted">tags · lines · scopes</text>
<rect class="panel" x="275" y="284" width="205" height="80" rx="12"/><text x="291" y="310" font-size="13" class="mono">acorn</text><text x="291" y="330" font-size="10.5" class="muted">ES module first,</text><text x="291" y="348" font-size="10.5" class="muted">classic-script retry</text>

<path class="wire" d="M485 250 H515"/><path class="flow" d="M487 250 H511" marker-end="url(#path-dark-arrow)"/>

<text x="520" y="128" font-size="11" class="kicker">03 / RESOLVE</text>
<rect class="key" x="520" y="140" width="210" height="224" rx="12"/>
<text x="538" y="170" font-size="14" class="mono">graph.json</text>
<text x="538" y="194" font-size="11" class="muted">one JSON file</text>
<text x="538" y="224" font-size="12" class="mono">6 node kinds</text>
<text x="538" y="246" font-size="12" class="mono">8 edge kinds</text>
<text x="538" y="268" font-size="12" class="mono">rerenders edges</text>
<text x="538" y="290" font-size="12" class="mono">file:line on each</text>
<text x="538" y="312" font-size="12" class="mono">source stamp</text>
<text x="538" y="334" font-size="11" class="muted">unresolved_file warnings</text>
<text x="538" y="352" font-size="11" class="mono muted">.wxgraph/graph.json</text>

<path class="wire" d="M735 250 H765"/><path class="flow" d="M737 250 H761" marker-end="url(#path-dark-arrow)"/>

<text x="770" y="128" font-size="11" class="kicker">04 / QUERY</text>
<rect class="panel" x="770" y="140" width="200" height="96" rx="12"/><text x="786" y="168" font-size="13" class="mono">CLI</text><text x="786" y="190" font-size="10.5" class="muted">build · impact · explain</text><text x="786" y="208" font-size="10.5" class="muted">search · stats · init</text><text x="786" y="226" font-size="10.5" class="mono muted">--up · --json · -C</text>
<rect class="panel" x="770" y="248" width="200" height="76" rx="12"/><text x="786" y="276" font-size="13" class="mono">MCP over stdio</text><text x="786" y="298" font-size="10.5" class="muted">5 tools, same graph</text><text x="786" y="316" font-size="10.5" class="muted">stale graph refused</text>

<text x="30" y="404" font-size="12" class="muted">Every edge carries its own file:line. A file that fails both parse modes becomes a warning, not silence.</text>
</svg>