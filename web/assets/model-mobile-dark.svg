<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" role="img" aria-labelledby="model-mobile-dark-t model-mobile-dark-d" data-palette="56bde6-6a81e7-acf6f0-0b4d974338e6">
<title id="model-mobile-dark-t">wxgraph graph model, narrow (dark)</title><desc id="model-mobile-dark-d">The rerenders chain stacked for a phone-width viewport, followed by failed-hop and non-literal setData notes.</desc>
<defs>
<linearGradient id="model-mobile-dark-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="820"><stop stop-color="#56bde6"/><stop offset=".55" stop-color="#6a81e7"/><stop offset="1" stop-color="#acf6f0"/></linearGradient>
<radialGradient id="model-mobile-dark-haze"><stop stop-color="#56bde6" stop-opacity=".16"/><stop offset="1" stop-color="#050a12" stop-opacity="0"/></radialGradient>
<marker id="model-mobile-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6a81e7" stroke-width="1.5"/></marker>
</defs><style>
text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#eefdfc}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace}
.muted{fill:#95b1c4}
.title{font-weight:700;letter-spacing:-.4px}
.kicker{font-weight:700;letter-spacing:2px;fill:#95b1c4}
.panel{fill:#0c151f;stroke:#173141;stroke-width:1.2}
.key{fill:#0c151f;stroke:#56bde6;stroke-width:1.6}
.dashed{fill:#0c151f;stroke:#95b1c4;stroke-width:1.1;stroke-dasharray:6 5}
.chip{fill:#0a141d;stroke:#173141;stroke-width:1}
.wire{fill:none;stroke:#173141;stroke-width:1.5}
.flow{fill:none;stroke:#56bde6;stroke-width:1.8;stroke-dasharray:7 10;animation:dash 2.8s linear infinite}
.primary{fill:#56bde6}
.secondary{fill:#6a81e7}
.highlight{fill:#acf6f0}
.pulse{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}.flow{stroke-dasharray:none}}</style>
