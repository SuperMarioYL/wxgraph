<text x="36" y="42" font-size="11" class="kicker">ARCHITECTURE</text>
<text x="36" y="78" font-size="23" class="title">One owned edge,</text>
<text x="36" y="106" font-size="23" class="title">six node kinds</text>
<text x="36" y="132" font-size="11.5" class="muted">Every hop must resolve; misses are printed.</text>
<rect class="panel" x="36" y="112" width="568" height="66" rx="12"/><text x="52" y="136" font-size="10" class="kicker">01</text><text x="86" y="137" font-size="12.5">setData key</text><text x="86" y="159" font-size="11.5" class="mono primary">items</text><path class="wire" d="M320 180 V190"/><path class="flow" d="M320 180 V188" marker-end="url(#model-mobile-dark-arrow)"/><rect class="panel" x="36" y="190" width="568" height="66" rx="12"/><text x="52" y="214" font-size="10" class="kicker">02</text><text x="86" y="215" font-size="12.5">data path</text><text x="86" y="237" font-size="11.5" class="mono primary">items[].unitPrice</text><path class="wire" d="M320 258 V268"/><path class="flow" d="M320 258 V266" marker-end="url(#model-mobile-dark-arrow)"/><rect class="panel" x="36" y="268" width="568" height="66" rx="12"/><text x="52" y="292" font-size="10" class="kicker">03</text><text x="86" y="293" font-size="12.5">host attribute</text><text x="86" y="315" font-size="11.5" class="mono primary">price=&quot;{{...}}&quot;</text><path class="wire" d="M320 336 V346"/><path class="flow" d="M320 336 V344" marker-end="url(#model-mobile-dark-arrow)"/><rect class="panel" x="36" y="346" width="568" height="66" rx="12"/><text x="52" y="370" font-size="10" class="kicker">04</text><text x="86" y="371" font-size="12.5">declared property</text><text x="86" y="393" font-size="11.5" class="mono primary">price</text><path class="wire" d="M320 414 V424"/><path class="flow" d="M320 414 V422" marker-end="url(#model-mobile-dark-arrow)"/><rect class="panel" x="36" y="424" width="568" height="66" rx="12"/><text x="52" y="448" font-size="10" class="kicker">05</text><text x="86" y="449" font-size="12.5">child binding</text><text x="86" y="471" font-size="11.5" class="mono primary">{{price}}</text><path class="wire" d="M320 492 V502"/><path class="flow" d="M320 492 V500" marker-end="url(#model-mobile-dark-arrow)"/><rect class="key" x="36" y="502" width="568" height="66" rx="12"/><text x="52" y="526" font-size="10" class="kicker">06</text><text x="86" y="527" font-size="12.5">WXML element</text><text x="86" y="549" font-size="11.5" class="mono primary">&lt;text&gt;</text>
<rect class="dashed" x="36" y="594" width="568" height="104" rx="12"/>
<text x="52" y="620" font-size="10.5" class="kicker">FAILED HOP — PRINTED, NOT GUESSED</text>
<text x="52" y="646" font-size="12" class="mono primary">no_binding · unknown_property · no_child_binding</text>
<text x="52" y="670" font-size="11" class="muted">impact prints unresolved hop(s); explain prints every attempt.</text>
<text x="52" y="688" font-size="11" class="muted">A non-literal setData is unresolved_setdata: call site kept, keys unknown.</text>
<text x="36" y="738" font-size="11" class="muted">via prop:&lt;name&gt; crosses a declared property; via direct stays in the owner template.</text>
<text x="36" y="762" font-size="11" class="muted">A resolved edge is structural: wx:if can still keep the element out.</text>
