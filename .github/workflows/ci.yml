name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check version files agree
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = fs.readFileSync("VERSION", "utf8").trim();
            if (manifest.version !== version) {
              console.error(`package.json has ${manifest.version}, VERSION has ${version}`);
              process.exit(1);
            }
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run
